[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emgimu-human-state"
version = "0.1.0"
description = "Physiology-informed dual-axis EMG/IMU human-state estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
neural = ["torch>=2.1,<3"]
reference = ["h5py>=3.8,<4"]
osc = []
dev = ["pytest>=8,<9", "torch>=2.1,<3"]

[project.scripts]
emgimu = "emgimu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
